<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKOI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15181b;
    --panel: #1c2023;
    --panel-hi: #21262a;
    --border: #33393e;
    --accent: #f2b419;
    --accent-dim: #7a5e1c;
    --rust: #c1613f;
    --text: #e3e5e6;
    --muted: #7d858c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }
  body {
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px 80px;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(242,180,25,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(193,97,63,0.05), transparent 40%);
  }

  .hazard {
    width: 84px;
    height: 6px;
    margin-bottom: 22px;
    background: repeating-linear-gradient(
      -45deg,
      var(--accent),
      var(--accent) 6px,
      #1a1a1a 6px,
      #1a1a1a 12px
    );
    opacity: 0.9;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 6px 0;
    color: var(--text);
  }
  h1 em {
    font-style: normal;
    color: var(--accent);
  }

  p.sub {
    color: var(--muted);
    margin: 0 0 40px 0;
    font-size: 13px;
    text-align: center;
    max-width: 380px;
    line-height: 1.6;
  }

  .search-wrap {
    width: 100%;
    max-width: 480px;
    position: relative;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    transition: border-color 0.15s ease;
  }
  .search-box:focus-within {
    border-color: var(--accent);
  }
  .search-box .prompt {
    padding-left: 18px;
    color: var(--accent);
    font-size: 16px;
    user-select: none;
  }
  input#search {
    flex: 1;
    padding: 16px 18px 16px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    border: none;
    background: transparent;
    color: var(--text);
    outline: none;
  }
  input#search::placeholder {
    color: var(--muted);
  }

  #suggestions {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    max-height: 260px;
    overflow-y: auto;
    z-index: 10;
    display: none;
  }
  #suggestions div {
    padding: 11px 18px;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    color: var(--text);
  }
  #suggestions div:last-child { border-bottom: none; }
  #suggestions div:hover {
    background: var(--panel-hi);
    color: var(--accent);
  }
  #suggestions div::after {
    content: '→';
    color: var(--muted);
  }
  #suggestions div:hover::after {
    color: var(--accent);
  }

  #result {
    width: 100%;
    max-width: 480px;
    margin-top: 28px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    padding: 26px 28px 22px;
    animation: rise 0.2s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0;
    font-size: 20px;
  }
  .count {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    white-space: nowrap;
    padding-left: 12px;
  }

  .uses {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .uses li {
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    line-height: 1.5;
    display: flex;
    gap: 12px;
    align-items: baseline;
    border-radius: 3px;
    transition: background 0.12s ease;
  }
  .uses li:hover {
    background: var(--panel-hi);
  }
  .uses li:last-child { border-bottom: none; }

  .tag {
    flex-shrink: 0;
    display: inline-block;
    min-width: 64px;
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--bg);
    background: var(--accent);
    padding: 4px 8px;
    clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 100%, 5px 100%);
  }
  .tag.quest { background: var(--rust); }
  .tag.workshop { background: var(--accent); }
  .tag.craft, .tag.project { background: #8f979d; }
  .tag.recycle { background: #1f8a4c; }
  .tag.sell { background: #4a7fa5; }
  .tag.recipe { background: #D3494E; }

  .notfound, .empty-state {
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    padding: 18px 0 0;
    line-height: 1.6;
  }

  .item-link {
    color: var(--accent);
    cursor: pointer;
    border-bottom: 1px dotted var(--accent-dim);
    transition: color 0.12s ease, border-color 0.12s ease;
  }
  .item-link:hover {
    color: #ffd061;
    border-bottom-color: #ffd061;
  }
</style>

function selectItem(item, push = true) {
  if (!item) return;
  searchInput.value = item.name;
  renderResult(item);
  if (push) {
    const url = '?item=' + slugify(item.name);
    history.pushState({ item: item.name }, '', url);
  }
}

const searchInput = document.getElementById('search');
const suggestionsBox = document.getElementById('suggestions');
const resultBox = document.getElementById('result');

function normalize(str) {
  return str.toLowerCase().trim();
}

function slugify(str) {
  return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function findBySlug(slug) {
  return ITEMS.find(i => slugify(i.name) === slug);
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function linkify(text, currentName) {
  const names = ITEMS.map(i => i.name).filter(n => n !== currentName).sort((a, b) => b.length - a.length);
  if (names.length === 0) return text;
  const pattern = new RegExp('\\b(' + names.map(escapeRegex).join('|') + ')\\b', 'g');
  return text.replace(pattern, (match) => `<span class="item-link" data-name="${match}">${match}</span>`);
}

function renderResult(item) {
  if (!item) {
    resultBox.innerHTML = '';
    return;
  }
  if (!item.uses || item.uses.length === 0) {
    resultBox.innerHTML = `
      <div class="card">
        <div class="card-head">
          <h2>${item.name}</h2>
        </div>
        <div class="notfound">No uses logged for this item yet.</div>
      </div>`;
    return;
  }
  resultBox.innerHTML = `
    <div class="card">
      <div class="card-head">
        <h2>${item.name}</h2>
        <span class="count">${item.uses.length} USE${item.uses.length > 1 ? 'S' : ''} LOGGED</span>
      </div>
      <ul class="uses">
        ${item.uses.map(u => `
          <li>${u.type ? `<span class="tag ${u.type.toLowerCase()}">${u.type}</span>` : ''}<span>${linkify(u.text, item.name)}</span></li>
        `).join('')}
      </ul>
    </div>`;
}

function showSuggestions(query) {
  const q = normalize(query);
  if (!q) {
    suggestionsBox.style.display = 'none';
    return;
  }
  const matches = ITEMS.filter(i => normalize(i.name).includes(q)).slice(0, 8);
  if (matches.length === 0) {
    suggestionsBox.style.display = 'none';
    return;
  }
  suggestionsBox.innerHTML = matches.map(i => `<div data-name="${i.name}">${i.name}</div>`).join('');
  suggestionsBox.style.display = 'block';
}

searchInput.addEventListener('input', (e) => {
  const q = e.target.value;
  showSuggestions(q);

  const exact = ITEMS.find(i => normalize(i.name) === normalize(q));
  if (exact) {
    selectItem(exact);
  } else if (!q) {
    resultBox.innerHTML = '';
    history.pushState({}, '', location.pathname);
  }
});

suggestionsBox.addEventListener('click', (e) => {
  const target = e.target.closest('div[data-name]');
  if (!target) return;
  const name = target.getAttribute('data-name');
  suggestionsBox.style.display = 'none';
  const item = ITEMS.find(i => i.name === name);
  selectItem(item);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) {
    suggestionsBox.style.display = 'none';
  }
});

resultBox.addEventListener('click', (e) => {
  const target = e.target.closest('.item-link');
  if (!target) return;
  const name = target.getAttribute('data-name');
  const item = ITEMS.find(i => i.name === name);
  selectItem(item);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = searchInput.value;
    const item = ITEMS.find(i => normalize(i.name) === normalize(q)) ||
                 ITEMS.find(i => normalize(i.name).includes(normalize(q)));
    if (item) {
      selectItem(item);
    } else {
      resultBox.innerHTML = `<div class="notfound">// no record found for "${q}"</div>`;
    }
    suggestionsBox.style.display = 'none';
  }
});

window.addEventListener('popstate', () => {
  const params = new URLSearchParams(location.search);
  const slug = params.get('item');
  const item = slug ? findBySlug(slug) : null;
  if (item) {
    searchInput.value = item.name;
    renderResult(item);
  } else {
    searchInput.value = '';
    resultBox.innerHTML = '';
  }
});

(function initFromURL() {
  const params = new URLSearchParams(location.search);
  const slug = params.get('item');
  const item = slug ? findBySlug(slug) : null;
  if (item) {
    selectItem(item, false);
  }
})();
</script>
